name: Backend Tests

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  # Called by release.yml, which publishes only after this passes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow
      - run: python -m pytest -v
