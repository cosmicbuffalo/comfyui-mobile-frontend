name: Upstream parity

# Everything this frontend depends on that it does not own: other people's
# custom-node packs, ComfyUI's own internals, and ComfyUI's official workflow
# templates. All three move on their own schedule; when they do, we silently
# diverge. Re-check them weekly so drift surfaces as a named failure instead of
# a bug report months later.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/node-parity/**"
      - "scripts/check-node-parity.mjs"
      - "scripts/triage-template-drift.mjs"
      - ".github/workflows/node_parity.yml"
      - "src/utils/__tests__/stockFrontendCompatibility.test.ts"
      - "src/utils/__tests__/templateCorpus.manifest.json"

jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Check upstream parity
        run: node scripts/check-node-parity.mjs

      - name: Explain a failure
        if: failure()
        run: |
          echo "::warning::A custom-node pack changed in a way our port depends on."
          echo "Re-read the upstream source named in the failure, update our"
          echo "implementation, then update the assumption in"
          echo "scripts/node-parity/manifests.mjs (and bump verifiedVersion)."

  # ComfyUI ships its official workflow templates as their own wheel, on their
  # own release cadence. A template added upstream is a workflow our users will
  # open, so it gets audited against the rules stock's loader enforces before
  # anyone opens it on a phone. The suite skips itself when the corpus is
  # missing, which is right locally and useless here — REQUIRE_TEMPLATE_CORPUS
  # turns that skip into a failure so a green run always means it really ran.
  #
  # Upstream releasing templates is not, by itself, news. When it happens the
  # audit cases re-run against the new templates and pass, and the only thing
  # left failing is the manifest recording which corpus we last audited. This
  # job re-blesses that manifest and hands it to `bless` below to commit,
  # rather than going red weekly for something nobody has to act on. Red here
  # means the audit itself failed, or stock's own loader started rejecting a
  # template it used to accept.
  #
  # Read-only, deliberately. It runs `npm ci` and a test file, which on a
  # pull_request run is code the pull request controls, and nothing it does
  # needs to write to the repository. Committing is `bless`'s job and no PR
  # ever reaches it.
  templates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.triage.outputs.verdict }}
      title: ${{ steps.triage.outputs.title }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci

      - name: Install ComfyUI's official templates
        run: pip install --upgrade comfyui-workflow-templates

      - name: Locate the template corpus
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import comfyui_workflow_templates_json as pkg
          print(f"COMFYUI_TEMPLATES_DIR={os.path.join(os.path.dirname(pkg.__file__), 'templates')}")
          PY

      # Allowed to fail: which cases failed is the input to the triage below,
      # not the verdict. The next step is what decides whether this job is red.
      - name: Audit the templates against stock's load rules
        id: audit
        continue-on-error: true
        env:
          REQUIRE_TEMPLATE_CORPUS: "1"
          TEMPLATE_DRIFT_REPORT: template-drift.json
        run: |
          npx vitest run src/utils/__tests__/stockFrontendCompatibility.test.ts \
            --reporter=default --reporter=json --outputFile.json=template-audit.json

      - name: Was that a release upstream, or something that needs a person?
        id: triage
        run: |
          node scripts/triage-template-drift.mjs \
            --results template-audit.json \
            --drift template-drift.json \
            --report template-drift.md \
            --commit-msg template-drift.commit

      # Benign drift only. The manifest case writes the new corpus out when
      # UPDATE_TEMPLATE_MANIFEST is set, and the run right after it proves the
      # file it wrote is one the whole suite passes against — without that, a
      # re-bless could hand `bless` a manifest nobody has actually checked.
      - name: Re-bless the corpus manifest
        if: steps.triage.outputs.verdict == 'drift'
        env:
          REQUIRE_TEMPLATE_CORPUS: "1"
          UPDATE_TEMPLATE_MANIFEST: "1"
        run: npx vitest run src/utils/__tests__/stockFrontendCompatibility.test.ts

      - name: Re-run the audit against the manifest it just wrote
        if: steps.triage.outputs.verdict == 'drift'
        env:
          REQUIRE_TEMPLATE_CORPUS: "1"
        run: npx vitest run src/utils/__tests__/stockFrontendCompatibility.test.ts

      # The manifest and the prose about it, for `bless` to commit. Passing
      # three files between jobs is the price of keeping the job that runs the
      # test suite away from a write-capable token.
      - name: Hand the re-blessed manifest to the publishing job
        if: steps.triage.outputs.verdict == 'drift'
        uses: actions/upload-artifact@v4
        with:
          name: template-rebless
          path: |
            src/utils/__tests__/templateCorpus.manifest.json
            template-drift.md
            template-drift.commit
          if-no-files-found: error
          retention-days: 7

      - name: Explain a failure
        if: failure()
        run: |
          echo "::warning::An edit we make to a workflow no longer loads in the stock frontend, or stock's own loader started rejecting a template it used to accept."
          echo "This job re-blesses the corpus manifest by itself when upstream merely"
          echo "released templates, so a red run here is not that: read the triage step."

  # The only job that can write, and the only one a pull request cannot reach.
  #
  # The ref guard is what keeps this honest. Dispatching this workflow from a
  # feature branch audits that branch — which is useful — but must never be
  # able to force-push it into the shared re-bless branch and open a PR full of
  # unrelated work, so publishing happens only when the ref is main.
  #
  # One at a time, across every trigger. The branch below is shared and
  # force-pushed, so two of these running at once — a manual dispatch crossing
  # the Monday cron, or a re-run of an older run — would race, and the loser
  # would be whichever audit was newer. Queue rather than cancel: a bless job
  # interrupted between its push and its PR leaves a branch nobody opened.
  bless:
    needs: templates
    if: >-
      needs.templates.outputs.verdict == 'drift'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: bless-template-corpus
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The commit the audit actually ran against, not whatever main has become
      # since. `main` moving between the two jobs is unlikely and would be
      # quiet: the manifest was validated against one tree and would be
      # committed onto another, and this PR has no checks to catch it. The `if`
      # above already established that this ref is main, so taking the run's
      # SHA gives up nothing.
      #
      # Full history: this job pushes a branch, and a push out of a depth-1
      # clone is the kind of thing that works until the day it doesn't.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Lands the re-blessed manifest on top of the checkout, exactly where the
      # audit job wrote it, plus the two scratch files (both gitignored).
      - uses: actions/download-artifact@v4
        with:
          name: template-rebless
          path: .

      # One long-lived branch, force-pushed: upstream ships templates most
      # weeks, and a fresh PR every week would be noise.
      - name: Open a pull request for the re-blessed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST: src/utils/__tests__/templateCorpus.manifest.json
          BRANCH: chore/bless-template-corpus
          # Through the environment rather than interpolated into the script
          # below. The title is built from counts by a script in this repo, so
          # it is safe today; taking a `run:` block's text from an expression
          # is the habit worth not having.
          PR_TITLE: ${{ needs.templates.outputs.title }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$MANIFEST"; then
            echo "::notice::Drift was reported but the manifest is unchanged; nothing to open."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$MANIFEST"
          git commit --file template-drift.commit
          git push --force origin "$BRANCH"

          # This PR gets no checks of its own: a GITHUB_TOKEN push does not
          # start a workflow. The run that opened it is the check, and it says
          # so in the body rather than leaving an unexplained empty checks box.
          {
            cat template-drift.md
            echo
            echo "---"
            echo
            echo "Opened by the weekly [Upstream parity](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) run."
            echo "GitHub does not start workflows for a PR pushed with \`GITHUB_TOKEN\`, so the"
            echo "checks box here stays empty — that run is the audit, and it passed twice:"
            echo "once against the new corpus, once again against the manifest it wrote."
          } > pr-body.md

          # The branch is pushed either way; only the PR itself is best-effort.
          # Opening one needs "Allow GitHub Actions to create and approve pull
          # requests" in the repository's Actions settings, and if that ever
          # gets turned off the audit is still green — which is what this job
          # is for. Warn and leave the branch to be opened by hand.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" -gt 0 ]; then
            gh pr edit "$BRANCH" --title "$PR_TITLE" --body-file pr-body.md \
              && echo "::notice::Updated the open re-bless PR for $BRANCH." && exit 0
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$PR_TITLE" --body-file pr-body.md \
              && echo "::notice::Opened a re-bless PR for $BRANCH." && exit 0
          fi
          echo "::warning::Pushed $BRANCH but could not open or update its pull request."
          echo "Open it here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/$BRANCH?expand=1"

      # The audit already passed by the time this job runs, so a failure here
      # is never a template problem — say so, rather than sending whoever opens
      # the run looking for one.
      - name: Explain a failure
        if: failure()
        run: |
          echo "::warning::The audit passed and the drift was benign; committing or pushing the re-blessed manifest is what failed."
          echo "Nothing is wrong with the templates. Re-bless by hand with:"
          echo "  UPDATE_TEMPLATE_MANIFEST=1 npx vitest run src/utils/__tests__/stockFrontendCompatibility.test.ts"
